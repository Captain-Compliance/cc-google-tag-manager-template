versions:
  # latest version
  - sha: 35624c667e01027cdb5e7d853f257b7acee8d4a9
    changeNotes: >-
      Consent-Mode-native release. The template now sets Google Consent Mode v2
      default state (all non-essential purposes denied by default in
      consent-required regions, region-scoped) before Google tags fire, injects
      the Captain Compliance banner, and calls updateConsentState from the
      captainComplianceConsent event / cc_consent_preference cookie so
      ad_storage, analytics_storage, ad_user_data and ad_personalization flip on
      the visitor's choice. Honors GPC. Adds configurable banner base URL,
      region list, wait-for-update, and optional ads_data_redaction /
      url_passthrough / IAB TCF toggles.
